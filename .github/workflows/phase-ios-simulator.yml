name: iOS Packager (Phase iOS-Stable)

# Phase iOS-Stable §5 — host-OS-agnostic iOS .app bundle emitter +
# macOS-runner iOS Simulator compile check.
#
# Job 1 (Windows): Verifies that `KSPackager.runIOS` (pure Swift string
#   emission) builds and emits a structurally valid .app bundle (Info.plist,
#   sanitized Kalsae.json, frontend at root). Uses a stub Mach-O placeholder.
#
# Job 2 (macos-14): Compiles the KalsaePlatformIOS module + the
#   KalsaeIOSSample for the iOS Simulator destination via xcodebuild against
#   the SwiftPM scheme. Catches iOS-only compile regressions (UIKit /
#   WKWebView API drift, @available gating, etc.). Does NOT boot the
#   simulator or run tests — that e2e step is deferred.

on:
  push:
    branches: [main]
    paths:
      - 'Sources/KalsaeCLI/Support/PackagerIOS.swift'
      - 'Sources/KalsaeCLI/Commands/BuildCommand.swift'
      - 'Sources/KalsaePlatformIOS/**'
      - 'Tests/KalsaeCLITests/PackagerIOSAppBundleTests.swift'
      - 'Tests/KalsaePlatformIOSTests/**'
      - '.github/workflows/phase-ios-simulator.yml'
  pull_request:
    paths:
      - 'Sources/KalsaeCLI/Support/PackagerIOS.swift'
      - 'Sources/KalsaeCLI/Commands/BuildCommand.swift'
      - 'Sources/KalsaePlatformIOS/**'
      - 'Tests/KalsaeCLITests/PackagerIOSAppBundleTests.swift'
      - 'Tests/KalsaePlatformIOSTests/**'
      - '.github/workflows/phase-ios-simulator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packager:
    name: iOS Packager (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            setup-swift: true
            swift-version: swift-6.3.1-release
            swift-build: 6.3.1-RELEASE

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Swift
        if: matrix.setup-swift
        uses: compnerd/gha-setup-swift@main
        with:
          swift-version: ${{ matrix.swift-version }}
          swift-build: ${{ matrix.swift-build }}

      - name: Show Swift Version
        run: swift --version

      - name: Fetch WebView2 SDK (Windows host only — needed to build kalsae CLI)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Scripts/fetch-webview2.ps1

      - name: Cache SwiftPM Build
        uses: actions/cache@v5
        with:
          path: .build
          key: ${{ runner.os }}-ios-packager-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-ios-packager-

      - name: Build kalsae CLI
        run: swift build --product kalsae -Xswiftc -warnings-as-errors

      - name: Run PackagerIOSAppBundle unit tests
        run: swift test --filter "PackagerIOSAppBundle" -Xswiftc -warnings-as-errors

  ios-simulator-build:
    name: iOS PAL Build (Simulator)
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show Swift Version
        run: swift --version

      - name: Cache SwiftPM Build
        uses: actions/cache@v5
        with:
          path: .build
          key: macos-ios-sim-${{ hashFiles('Package.resolved') }}
          restore-keys: |
            macos-ios-sim-

      # SwiftPM에서 iOS Simulator로 직접 빌드할 수 없으므로 xcodebuild를 통해
      # Package.swift 스킴(KalsaePlatformIOS)을 iOS Simulator 타겟으로 컴파일.
      # 시뮬레이터 부팅이나 테스트 실행은 하지 않고 컴파일 통과만 검증한다 —
      # 실제 시뮬레이터 부팅 e2e는 별도 follow-up 워크플로로 분리 예정.
      - name: Build iOS PAL for Simulator (arm64 + x86_64)
        run: |
          xcodebuild build \
            -scheme KalsaePlatformIOS \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-ios-sim \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS Sample app for Simulator
        run: |
          xcodebuild build \
            -scheme KalsaeIOSSample \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build-ios-sample \
            -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
        working-directory: Samples/KalsaeIOSSample
        continue-on-error: true
